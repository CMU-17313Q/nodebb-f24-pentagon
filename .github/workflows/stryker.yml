name: Stryker Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mutation-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16' # Ensure this matches the Node version your project uses

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test # Ensure your tests are working before running Stryker

      - name: Install Stryker
        run: npm install --save-dev @stryker-mutator/core

      - name: Run Stryker Mutation Testing
        run: npx stryker run

      - name: Upload Stryker Report
        if: success() || failure()
        uses: actions/upload-artifact@v2
        with:
          name: stryker-report
          path: reports/mutation/html
